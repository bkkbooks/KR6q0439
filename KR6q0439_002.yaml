body:
  text: 嗣法門人清杲編次荊州菩提場語録康熙十四年十二月闔郡護法諸山耆宿送法衣錦帳祝壽請就菩提場開堂師拈法衣曰黃梅夜半傳來此大庾嶺頭又相逢針去線來成一片蓋覆人天不露蹤上堂指法座菩提座最崚嶒是誰敢踏上頭行欲登菩提座須是菩提人喝一喝便升拈香此一瓣香根盤大地蔭覆蒼生爇向爐中祝延今上皇帝聖躬萬歲恭願人人歌舜日處處樂堯年此一瓣香得之者價重連城聞之者毛孔生香奉為闔國文武官僚伏願君愛如掌珠民親若特怙此一瓣香塞太虛而無相包群品而有形奉為現住真州地藏禪寺沙翁海老和尚用酬法乳之恩伏願垂正眼於末世樹弘範於萬年就座垂語弘揚大法人皆會舌覆三千道不難還有道得恰好者麼僧出問和尚千秋四衆臨筵如何是慶祝一句師拈拄杖曰與他增箇光彩進曰恁麼則紅日當空照師曰縱橫豈有私問十方如來無量壽菩提堂上又如何師曰識得主中主人人壽量同乃曰河沙世界當體無外日月奔忙其中光彩法法全彰物物無礙有時拈起波羅華驚起頭陀笑滿腮普眼菩薩長垂手樓閣門前善財來分明有箇賓主句得遇知音口不開既是得遇知音因甚口不開喝一喝上堂僧問道本無形法有當機且當機一句如何道師曰爾我相對面進曰世尊未出母胎說法已畢和尚今日因甚又如此叨呾師曰劍為不平離寶匣藥因救病出金瓶進曰一條拄杖活如龍觸天觸地展家風師曰汝切忌被他觸破骷髏進曰佛與衆生既同一箇鼻孔因甚又有優劣師曰夢裏多少欣歡事覺後不知何處消乃拈拄杖曰拄杖子現神通情與無情顯現中上穿三世諸佛鼻孔下豁一切衆生心胸有時在十字街頭和泥合水有時在孤峰頂上嘯月吟風赤條條八面玲瓏光灼灼氣宇吞虹復卓一下曰幾度伴歸明月夜今朝扶過斷橋東復舉神秀禪師曰身是菩提樹心如明鏡臺時時勤拂拭勿使惹塵埃六祖曰菩提本無樹明鏡亦非臺本來無一物何處惹塵埃師曰二大老一箇抱贓叫屈一箇認奴作郎撿點將來俱未見菩提端的今日菩提聊成一偈舉似諸人遂卓拄杖曰箇是菩提樹灼然明鏡臺照徹當人面何處是塵埃久雨祈晴上堂鍾鼓齊鳴衆集師登法座曰住便歸方丈臘八上堂僧問三界衆生皆是凡夫未審和尚是聖是凡師拈拄杖曰識得拄杖子麼僧無語師連打數下曰汝道是聖是凡乃曰報曉明星逐夜忙瞿曇忽睹面皮黃慚愧通身無著處贏得人間稱覺皇豎拂子曰明星現也切忌癡呆妄想復舉雲門曰無量劫來穿衣不曾挂著一縷無量劫來喫飯不曾咬著一米今日菩提場中傳此千佛大戒披衣持盔營辦香齊若言咬著披著未知落處若言不曾咬著披著亦未知落處畢竟如何良久曰雲散水清孤月朗到頭終不背塵寰上堂僧問出林還又入林中重整披緇舊梵宮今日菩提瑞氣靄多因臘德起香風只如昔年披剃今日開堂還是天然有種還是特地傳來師曰拄杖撐開新日月芒鞋踏破舊乾坤乃曰衲僧垂手貴乎作家石鞏架箭祕魔擎叉雲門拈餅趙州喫茶禾山打鼓雪峰弄蛇今日菩提無別指廓開門戶任還家天然一路頭頭見豈必拈華與笑華復舉龐居士曰難難難十石油麻樹上攤龐婆曰易易易百草頭邊祖師意靈昭女曰也不難也不易饑來喫飯倦來睡師曰三人證龜成鱉則不無若是衲僧向上事猶未夢見如何是衲僧向上事拈拄杖曰手握莫邪全正令太平寰宇斬癡頑余赫尹三筆帖式請上堂卓拄杖曰即此意任縱橫一點靈光徹古今萬象得而增彩色幾箇知恩解報恩莫不是勇猛精進為法忘身莫不是努力進前戰退魔軍得勝回朝狼煙息大家團圞話無生誕日上堂拈拄杖曰即此含法界即此絶形名凡聖空中華佛國若微塵有問年多少孤光籠古今妙哉親一見人人合本真復卓一下曰三玄三要四賓主五位君臣九十六種圓相一大藏所說語言文字猶如胡餅觀音菩薩將錢買來放下手時原來是箇饅頭會麼喝一喝結制上堂僧問嫩桂一枝荊南永茂永茂且置如何是一動一靜師曰除卻動靜向汝道進曰如何是一靜師曰鬧浩浩進曰如何是一動師曰寂悄悄進曰動靜俱無又作麼生師曰死水不藏龍有水皆含月無山不帶雲師曰切莫錯認定盤星問擎卻娘生鼻孔方知劫外春風識得菩提一路分明覿面相逢如何是覿面相逢底事師拈拄杖曰者裏是甚麼所在進曰天華散彩去也師曰莫眼華乃曰偶爾禪衲聚首喜與聖凡同遊菩提無可施設只得將無作有禪堂寮舍聊備二時粥飯應手但能開得大口吞卻四大部洲只如情與無情又向甚麼安身立命良久曰平生肝膽向人傾箇中那有元字腳西堂三旬請上堂僧問千年公案今日重新如何是慶生句師曰青天白日進曰如何是父母未生前面目師卓拄杖曰是箇甚麼進曰如何是已生面目師打曰向者裏會取問風雲聚會華雨繽紛七珍八寶請師拈出師曰一二三進曰大衆如何受用師曰三二一問賓主酬唱即不問如何是與虛空同壽師曰無古無今進曰北海慶祝又如何師曰有始有終乃曰瞿曇初生便言天上天下唯吾獨尊血腥猶在淨梵王宮一十九載無窮快樂習染成風雪山夜睹三十成道志滿寰宇掀翻海嶽說法四十九年不曾談著一字末後拈華飲光默契雖是世出世間大丈夫所為奈何公案不了今日未免帶纍卓拄杖曰世間有道歸王化幾箇男兒酬聖明復舉老子謂孔子曰使道而可獻則人莫不獻之於其君使道而可進則人莫不進之於其親使道而可以告人則人莫不告其兄弟使道而可以與人則人莫不與其子孫地藏海和尚曰老聃之言陋矣地藏今日要獻可以獻要進可以進要告人可以告人要與人可以與人不費纖力安用躊躇遂展兩手曰吾無隱乎爾師曰我和尚雖有廣大慈悲人天普施爭奈罕遇其人菩提今日兩手分付還有承當者麼喝一喝彌陀誕日說戒見聞請上堂僧問戒定慧即不問如何是彌陀降生意旨師曰一聲喚醒癡憨夢淨土蓮華當處開進曰戒壇嚴淨戒德冰霜還有祥瑞麼師曰禮佛三時未是苦盔盂兩度觜唇勞乃曰持戒比丘絶貪瞋又得彌陀喚一聲渾身都在塵剎裏覓箇知音徹底傾且道喚來傾箇甚麼豎拂子曰即此見聞非見聞無餘聲色可呈君尼上機禪師六旬請上堂拈拄杖曰果然一見意宛然妙有神機格外傳塵點劫來原不二河沙壽算喻難宣三玄三要明斯旨十智同真面目全溷法界而無相和四生而不遷復卓拄杖曰喚作拄杖子則觸不喚作拄杖子則背不觸不背畢竟喚作甚麼喝一喝曰今日天晴復舉達磨祖師命門人曰時將至矣汝等盍各言所得乎時有道副對曰如我所見不執文字不離文字而為道用祖曰汝得吾皮尼總持曰我今所解如慶喜見阿閦佛國一見更不再見祖曰汝得吾肉道育曰四大本空五陰非有而我見處無一法可得祖曰汝得吾骨最後慧可禮拜依位而立祖曰汝得吾髓師曰皮肉骨髓之分大似諒才補職只如二祖禮拜依位而立意作麼生卓拄杖曰會麼不是弄潮人徒勞遭點額解制上堂十字街頭結箇制東西南北任來去猛然解開布袋頭跳出陳年舊窠臼跳得出跳不出彌勒世尊手有力用盡神通緊挈住任汝計校百千般畢竟何能跳得出殊不知跳得出也在裏許跳不出也在裏許上機同朱鳳樓李馥之常華宇李元卿詹東樓等送千佛衣法被請上堂僧問直指單傳即不問雪裏梅開意若何師曰時節到來藏不住進曰河沙世界千佛繞大地山河一障屏師曰簫笛箜篌音韻殊進曰光映珠簾千戶月風生法院一聲鐘師曰好言語乃曰瞻之在前忽焉在後體無證而不顯妙有神而乃傳寒潭月影靜夜鐘聲隨扣擊以無虧觸波瀾而不散有時拈起毗盧印贏得面南看北斗威音那畔為屏障倒著袈裟四部洲十聖三賢諸品流都在光中頭出現卓拄杖曰會麼荊州報恩禪寺語録本省提臺徐公建報恩寺上堂若人欲識佛境界當淨其意如虛空遠離妄想及諸取令心所向皆無礙汝等還識令心所向皆無礙麼即今天清地寧時康道泰四海樂無虞普天承至化大將軍建寺報君親報佛祖并資法界含靈無恩不報無德不酬如此可謂令心所向皆無礙我林下衲僧又如何揮拂子曰人人軒豁頂門眼四海熙熙樂太平師六旬上堂天地永久日月恆明虛空常在誰死誰生世間甲子數一遍又到明年是丙寅上堂百草思抽箭梅華先送香相逢道新喜春光日浙長鳳楚華甲滿祈禱壽無疆但願道心如今日管教事事出情常機緣問僧人人有箇影子因甚踏不著僧曰步步踏著師曰踏著則喪身失命僧喝師便打僧問瞻之在前忽焉在後時如何師豎起竹篦曰不得喚作前後速道速道僧擬議師打出僧問如何是不生不滅底意旨師曰森羅萬象四聖六凡僧擬對師打退又一僧禮拜歸位師曰道得分明又一僧亦禮拜歸位師曰你未夢見問僧汝號甚麼僧曰雙融師曰一不成單二不成雙作麼生融僧無語師便喝僧問四大分張死了燒了那裏是安身立命處師展兩手曰一坑埋卻僧號見聞師曰未見未聞時如何僧喝師便打僧問父母未生前如何是本來面目師曰你問我答會麼僧問如何是眉毛眼上橫師擘面掌曰你向別處看僧罔措師便歸方丈普請搬柴師至柴處問直歲那箇是底歲曰睡倒底是師曰何不豎起歲無語師肩柴便行問侍僧山僧今日落堂有幾人道得恰好僧曰學人不知師曰有眼有耳因甚不知僧曰道破不堪師曰汝試道看僧禮拜師打曰汝向者裏躲跟僧問如何是西來大意師拈拄杖僧喝師便打問僧從上諸祖所傳箇甚麼僧曰只知明心見性不知何物可傳師喝僧忽有省師住度門僧問久響楞伽峰今借翻箇斤斗師豎扇曰翻看僧罔措師曰楞伽峰今日失利王中丞秦翰林訪師王問和尚還有夢麼師曰有王曰和尚夢如何師一喝曰公夢見麼王曰水月空華而已師謂秦曰公如何秦曰也無水月也無空華師曰畢竟如何秦一喝師曰好箇消息秦悚然師曰馬祖以前不知將甚麼拓出秦曰馬祖以前不知將甚麼拓出師呵呵大笑入室僧進師曰速道速道僧曰明明相見師曰明明相見箇甚麼僧頓足一下師曰腳忙手亂僧曰從來不隨人師曰如何是立定處僧擬議師打出僧進師曰親切道將來僧曰覿面即不見師曰因甚不見進曰動靜始分明師曰分明處道將來僧曰處處緑楊堪繫馬家家有路透長安師曰走煞闍黎拂機進師曰現成公案速道拂曰不落二三師曰一又如何拂曰一任縱橫師曰汝試縱橫看拂喝一喝便出僧進師便喝僧曰霹靂虛空無影相師曰汝不知者一喝落處僧便喝師曰看者一員戰將今日敗露了也僧又喝師和聲打出問僧現成公案道道僧曰今日打七已畢師曰你底事作麼生僧曰覿面消息不發引師曰覿面消息且置你因甚麼不發引僧擬對師打出請益進師曰今日不放過你僧曰昨日已道過師曰今日事作麼生僧禮拜師曰算不得僧進以坐具打圓相復頓足一下師曰亂跳僧曰識得娘生面拈來不覆藏師拈拄杖曰者箇聻僧禮拜師曰卻被拄杖子吞了問僧親切處道將來僧曰能為萬象主不逐四時凋師曰即今事作麼生僧喝師打出僧問菩提本無樹明鏡亦非臺豎拳曰者箇是甚麼師便打僧曰本來無一物何處惹塵埃師直打出復呵呵大笑以手招僧曰汝來汝來本來無一物何事惹塵埃偈頌示張樂成誰信塵中爾獨能合歡聚首笑相親只為迦葉傳來久也效龐公現此身示焦守府日用尋常覿面時頭頭無礙是心歸若能觸目全身現妙舞場中任指揮示雪嶽耆宿尋聲逐色波中月默照猶然夢裏猜當下若能親一見通身毛孔吼如雷示善信監院出入道難測胸中別有知歷年芒履破只為到家時示了悟塔主了然悟得其中旨佛也衆生無處安塔戶夜開千丈月全身倚在玉闌干示惟恆禪人惟有恆心悟是佛不知餘外用工夫但能觸物空雙眼月滿清光何處無世尊拈華拈華有意誰堪見舉目當陽覓轉殊百萬人天安不會勞他迦葉一胡盧南泉斬貓善言善語話不休一刀兩段絶支吾草鞋幸有安頭上贏得孤光照畫圖靈雲桃華桃華偶爾露天真觸碎靈雲腦後門夢醒豈因枝上月等閒收拾有誰論百丈耳聾等閒豎拂意何濃一喝直教三日聾徹底家私都蕩盡西江從此立宗風萬物一體粉碎虛空見萬物萬物粉碎見虛空瞥然寂寂全身泯月在波中顯正宗女子出定罔明女子與瞿曇依俙相似雪波瀾有時紅日當空照雪月波華何處看臨濟棒誰謂有三頓一棒絶言詮大法無今古滅卻瞎驢邊如意觸案全身現拈來徹體彰虛空通逼塞何處有封疆佛事為得戒澤和尚入塔以拄杖畫地曰長江水天上月辨得分明有何交涉爭似我師願力深縱橫無礙法常說問甚釋迦待甚彌勒度盡衆生方休歇舉靈骨曰今朝聊示與人看無縫塔中光皎潔為無染禪師舉火者箇皮囊人人脫不得看破今朝如湯消雪烈焰爐中撒手歸三三兩兩天機泄為淨明禪師起龕死而為陰生而為陽不生不死當處家鄉還知當處家鄉麼到頭終不藉舟航舉火妙淨明心體寂恆常更無一物火內清涼欲識當人真面目灰飛煙滅露堂堂入塔日出東方來日落西方去來則光含萬物去則藏身無蹟任君踏遍閻浮提終當消歸者一步者一步且置如何是淨公藏身無蹟處以拂子指塔戶曰通身無縫罅盡日白雲間為鐵女寺隱覺禪師舉火昔日如此來今朝如此去識得本來面生死任游戲且道如何是本來面烈焰光中親證得三世如來脫垢衣為行腳僧舉火踏遍乾坤為甚腳跟不點地通身放下方知處處是家鄉擲火炬曰勝熱婆羅今覿面眉毛鼻孔碧稜稜為映蓮禪師舉火精進勇猛日行持蓮經七軸終朝誦臨行不必再叮嚀烈焰之中飛彩鳳為盡虛舉火盡虛無內外四大總無依欲識當人面大海火星飛為體宗起龕踏遍乾坤徒沾泥水覽盡名山眼中熱鬧殊不知袈裟下事別有生涯體上座臨末稍頭還知落處麼以拄杖指龕曰驀直去舉火一二三四五六七七六五四三二一要知此箇循環事河沙諸佛也難覓既不能覓流轉三界是箇甚麼但能識取本源頭說甚心空及第歸為尼元正起龕秋月皎秋風涼驚起客途思故鄉堂堂大道眼前路秋水茫茫須自行舉火龍女十八變明珠解放光會得歸元處覿體絶承當擲火炬曰何妨雪上更加霜為慧菴禪師入塔法身無相塔戶何能關得住般若無知虛空權借作皮囊黃金骨鎖不二門一念萬年向此住為藻雪禪師舉火紅爐焰裏飛點雪面目儼然如何說沙界雖寬著不下太虛無邊猶嫌窄真人無位入長安亙古亙今無休歇無休歇火內蟭蟟吞皓月擲下火炬為純真禪師起龕相逢一笑已親承覓心無處露本真大道從來無言說更將何物舉似君雖然百尺竿頭急進步到家不必問途程入塔含蓋乾坤體中玄威音那畔有誰傳會得祖師端的旨劫火洞然也閒閒以拄杖指塔戶曰陰陽不到處一片白雲眠為王濟之舉火三十餘年牢把著白雲影裏鐵舟浮虛空嚼碎有滋味大地看來一舌頭此是我王公家嘗茶飯只如今日劫火發時如何回避真金入火後百煉見光輝為喬玉秀舉火畫餅難充饑畫蛇易添足一輪今古月誰道有圓缺喬公喬公莫沉吟識取火後鬚眉赤便燒為清玉舉火是玉須剖出荊山不用尋明明親切句六月火一盆為玄暢舉火綿綿細雨長空淚陳陳霜風萬木悲此去黃泉無旅店途程杳杳意何歸只如無所從來亦無所去又作麼生舉火炬曰識取紅爐片雪飛為詹東樓起棺諸佛出身處東山水上行葉落歸根時遍地是黃金東樓東樓不必別追尋條條都是到家程為惟覺舉火大道無難惟在一覺既已覺矣萬象銷鎔且道銷鎔後如何莫隨知解轉看取令行時為赫母舉火金棺涌出玉玲瓏包裹乾坤造化中其間更有微妙事情與無情一道同赫母今朝歸去路欻然火起烜天紅為朱清寧起棺聖凡歸元處別是一乾坤去來無異路妙用有多門棺內休瞪眼歸家罷問程為悟玄舉火列焰貫空情識斷眼光無處著塵埃煆成不壞金剛體任運消遙歸去來為董福寰掩棺者老居士一向鉗錘在手必要結就羅紋今日通身放下方知四大本空木直裰兒今著上錦上鋪華又一層為閻氏舉火箇裏原無二方便現剎塵面目分明在識取本來人幽閨深閣留不住一朵紅雲送爾行火內翻身真是好銀山鐵壁都靠倒法瀾澄禪師塔記附師諱原澄號法瀾荊州枝江陳氏子幼而英敏迥異諸兒每念生死無常雖豪傑不能免若非學出世法終沉苦海如是集憂至年二十詣菩提場禮夙成禪師祝髮為僧二十五於大澤法師處受具三十三參天王沙翁海和尚俾職監院又任堂司後升第一座一日海豎拂子曰汝向者裏會得百味具足師言下契悟海特以信拂授之出世住天王度門轉菩提本省提督軍門徐公治都建報恩寺延師開山為第一代師四坐道場因緣輻輳報恩將欲畢工忽示微疾凡問疾至者師不以寒㬈敘述直拈箇事覿面激揚舒卷自如毫無顧念至夜分泊然而逝實康熙二十八年三月初七日也師生明天啓六年丙寅十二月初十日世壽六十四僧夏四十四門弟子建塔於報恩寺之左今書大概以識歲月云爾門人清杲記弟子徐清寅黃永昌陳國鼎智海清能清泰本真宗永等敬刻板存嘉興府楞嚴寺誾大藏流行康熙二十八年己巳閏三月上浣謹識
