front:
  text: 法瀾澄禪師語録序溯自往代禪家克振宗風者代不數人至今目猶為空谷之音慨夫大道榛蕪性真翳障綿綿一線幾至廢墜而六祖五宗之心傳如泥牛入海永無消息即有一二後起咸分流別派見解紛紛拈棰豎拂騁辨馳鋒藤蔓不少而世之儒者因從而毀之是亦儒者之過也何也余嘗取兩家之言合而觀之吾儒言誠意正心而先致其知禪家言明心見性而不離於覺有二義乎繇誠正而修身以至齊治平皆此一知繇明心見性以至度盡衆生皆此一覺有二用乎內外既一何存彼此余客遊江陵得謁法瀾禪師知其為天王海公嫡嗣具向上爪牙讀其語録若月印萬川川川見月月既無聲水亦無相直令大地衆生盡在水月光中出現其機鋒敏捷又如金刀破竹使人情意無餘六祖五宗之心傳煥然若新而幾至廢墜之道亦可云克振矣又豈外吾儒而不吻合宗旨哉雖西來大意不假言詮然而繪風圖海聽之有聲獨不可授諸天下慧心人乎康熙十二年歲枉癸丑七月既望鍾山王才鼎沐手敬題法瀾澄禪師語録目録卷首序文卷上住荊州天王禪寺語録當陽度門禪寺語録卷下荊州菩提場語録荊州報恩禪寺語録機緣入室偈頌佛事塔記附法瀾澄禪師語録目録
