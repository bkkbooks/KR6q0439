body:
  text: 嗣法門人清杲編次住荊州天王禪寺語録康熙九年庚戌二月初一日進寺上堂拈香此一瓣香高超物表攝受群靈蒼生有賴萬彙沾恩恭為今上皇帝祝延萬歲此一瓣香為翰為屏為祥為瑞奉為滿朝文武本省提臺本府例位尊官伏願常展調羹手撥轉正法輪此一瓣香放去則道滿寰宇收來則法幢高豎奉為光賁天王棲賢獨冠敬太老和尚並及現前衆位法叔大和尚伏願聲價等南陽壽量同寶掌正拈香此一瓣香最初一步踏著至今受用不盡今對人天衆前拈出奉為中興本寺四坐道場本師沙翁海老和尚用酬法乳之恩就座信菴大師白捶曰法筵龍象衆當觀第一義師震聲一喝曰有識得此第一義者麼出來酬唱看信菴大師問天王奕葉播芳春千古令人憶轉深伐鼓聲鍾龍象集高山流水孰知音知音即不問大振綱宗事若何師曰拄杖頭邊金鳳舞進曰意氣不從天地得英雄豈藉四時催師曰鐵崑崙下死貓頭信喝師曰好喝楚菴大師問天王法道遠源流突出孤峰最上頭濟北宗風即不問高登猊座事如何師曰南山起雲北山下雨進曰龍得水時添意氣虎逢山勢長威獰師曰普天匝地又重新問向上全提即不問高峰四句請師宣師曰舊話不須拈進曰如何是海底泥牛銜月走師曰莫妄想如何是嵒前石虎抱兒眠師曰莫眼華如何是鐵蛇鑽入金剛眼師曰一串穿卻如何是崑崙騎象鷺鷥牽師曰看腳下進曰恁麼則瑞氣迎春色杲日麗中天師曰不妨道著夏居士問大道無雖唯嫌揀擇始終如一內外明徹明徹即不問始終如一事如何師曰全賴居士擔荷進曰庭前柏樹千年秀善法堂中句更新師曰若將耳聽終難會眼裏聞聲方始奇乃豎拂子曰見麼汝若見得千般説萬種諭總是賸事汝若不見山僧今日無事生事去也喝一喝曰見麼復曰即此天王道場頽廢千年幸我本師和尚竭力中興乃得叢林煥然大備今蒙慈命勉諸不肖住持又值棲賢太老人光臨同衆法叔抑逼升此曲彔木床只得藏身無地敗闕一上起身鞠躬曰伏惟衆慈極力包荒復舉世尊在靈山會上拈華示衆百萬人天罔措唯迦葉破顏微笑世尊曰吾有正法眼藏涅槃妙心付囑與汝毋令斷絶師曰釋迦老子將常住物私作人情人天衆前付與迦葉且委曲不少然迦葉亦現大人相一力擔當淵源不止以至今日遞相鈍置新天王今日亦有一偈呈似諸人一華拈起太郎當百萬人天笑裏藏匝地春風吹不盡留傳千古作宗綱結捶曰諦觀法王法法王法如是師下座衆慶佛誕請上堂僧問除卻古人公案斬斷陳年葛麻現前一著請師速道師曰大家相對面進曰恁麼則覓火和煙得擔泉帶月歸師曰不孤今日乃曰挽回法道振荊南祖席中興見大觀何幸於今同一會儼然未散在靈山若問箇中端的意今朝四月是初三直下豁然非性燥休來擬議隔重關且豫慶釋迦聖誕又作麼生一輪今古月空載幾人還佛誕請上堂僧問年年四月八處處慶悉達即今釋迦老子在甚麼處師曰有問有答進曰還當得慶賀事麼師曰春風歲歲新乃曰城東老母雙眼華雲門一棒也隨邪驀然識得自家寶將此身心獻釋迦只如指天指地又且如何良久曰結得恩深怨亦深年年惡水驀頭淋麻三斤兮乾矢橛誰道其中有指陳乃作攜瓶灌水勢曰蘇嚕蘇嚕㗭利㗭利結制上堂拈拄杖卓一卓曰爐韛從地起鉗錘隨手來有問向上事一擊頂門開還有赤身擔荷者麼僧出一喝師曰近火先焦問如何是奪人不奪境師卓拄杖曰穿卻汝鼻孔如何是奪境不奪人師曰擊碎汝腦門如何是人境兩俱奪師打曰天晴不肯走如何是人境俱不奪師曰放待冷來看進曰人境已蒙師指示末後一句又如何師復打曰還嫌少在問十方同聚會箇箇學無為即今考鍾伐鼓如何是無為師曰日輪當午照進曰大開爐韛又如何師曰烈焰烜天紅進曰天王山上來雲紫悟祖堂前瑞氣騰師曰塞滿乾坤乃曰無位真人長長短短清淨法身高高低低被天王捏作一團散向微塵國土要借諸人鼻孔出氣因甚如此千峰勢到嶽邊止萬派聲歸海上消復舉龐居士曰十方同聚會箇箇學無為此是選佛場心空及第歸師曰要見心空及第歸麼大千無知己獨露一身歸天王海老和尚退棲賢之真州地藏有書至上堂捧讀來書不舍遠去忍俊不禁舉似大衆良久曰一片白雲橫谷口幾多歸鳥盡迷巢菩提場監院同江居士請上堂僧問千林不耐凋寒葉幸有庭前柏樹芳歷盡三冬無異志西來大意請敷揚師曰昨夜六華添瑞彩進曰法鼓再撾宣億國祖燈重朗照人寰師曰今朝杲日正當空進曰而今借得東風力吹散浮雲見好天師曰是玉也大奇乃曰萬象森羅主乾坤法界尊識得他住處便是當家人初在菩提場爾為監院僧荷衆而竭力精勤忘五更今也來天王見爾廣大心要見古今天地古今日月麼憶昔楊岐會監院滿身霜雪播叢林復舉龐居士曰難難難十石油麻樹上攤龐婆曰易易易百草頭邊祖師意靈昭女曰也不難也不易飢來喫飯倦來睡師曰説難説易未免令人挂口今日江公會麼一口吸盡西江水露出天涯星月孤承天寺夏僧綱同衆請上堂僧問説有説無俱是諸方常語論色論空亦是座主活計除此二途請師施設師曰我無一法與人進曰欲得梅華放須憑霜雪催師打曰一棒打不回乃曰華座未登法雨先施潤大地真風才扇四海波騰演上乘恁麼會去達磨不必西來神光何須立雪殊不知滿口道不出分明在目前水中鹽味色裏膠青恁麼不會今日有飯在鉢內承天名剎主人賢不是尋常相恰好多生願力結斯緣雖然汝等不得飯飽弄箸佛成道日上堂僧問如何是天王境師曰御路如絃直進曰如何是境中人師曰相逢覿面親進曰人境雙忘時如何師曰天邊一鴈飛乃曰夜睹明星阿誰曉是聖是凡都靠倒唯有鼻孔無處藏碧稜稜底光皎皎天王見得為他扭捏一上以手作扭鼻勢曰釋迦老子隨手來也既曰一切衆生俱有如來智慧德相何故又要大驚小怪雖然不因樵子徑爭到葛洪家久雪初晴上堂盡謂世間有誰道世間無飄飄成一片何處覓畫圖豎拂子曰會麼一輪紅日纜出現依然露箇舊面目且道那箇是舊面目開眼便見山河大地春日上堂春宵一刻值千金華有清香月有陰歌館樓臺聲細細鞦韆院落夜沉沉古人觸境發情大有損益春宵一刻值千金黃金難買華有清香月有陰正好玩賞歌館樓臺聲細細樂在其中鞦韆院落夜沉沉歡娛夜短若是抱道衲僧別有一番景況春宵一刻值千金不可放過華有清香月有陰一種春色歌館樓臺聲細細漏泄太多鞦韆院落夜沉沉切莫瞌睡如此會得君親之恩三有之德一時酬畢其或未然寸絲滴水須償宿債除夕上堂僧問舊歲既云去新年又道來如何是不動尊師曰一箇間人天地間乃曰年月日時盡都言一歲除人生營世樂未免有榮枯獨有道人心不入他群隊既不入他群隊在甚處著腳隔塢梅華開正好攜笻看遍又歸來元旦上堂本來無新舊未免應時節焚香祝堯天堯天好風月焚香祝聖壽聖壽如天闊焚香祝大臣文武秉忠烈焚香祝國豐人民皆饒益更將此瓣香四恩三有盡酬畢且道者瓣香從甚處拈來地暖陽和新氣象無邊草木盡含春解制上堂僧問如何是第一玄師曰乾坤未剖前如何是第二玄師曰華開十丈蓮如何是第三玄師曰開口落言詮如何是第一要師曰拄杖開口笑如何是第二要師曰虛空無孔竅如何是第三要師曰放去收來妙僧曰三玄三要蒙師指今朝解制又若何師曰草溪筋斷任𨁝跳僧喝師曰亂跳問如何是函蓋乾坤句師便喝如何是隨波逐浪句師曰乾爆爆如何是截斷衆流句師曰水漉漉僧禮拜師乃曰九旬結制今朝滿賴護天龍事事安撩起即行真快便鼻頭爭奈柳條穿雖然今日山僧放開線道任汝鞋緊峭復舉芙蓉一日辭馬祖祖曰裝包了來與汝説一上佛法次日芙蓉至方丈侍立少頃祖曰時寒善為道路芙蓉行至法堂上忽然有省師曰馬祖恁麼提持芙蓉恁麼會去雖是針芥相投未免特地風波天王者裏也無佛法可説亦無人來告辭且道與古人相去多少良久曰此中無枝葉唯有諸真實上堂靈雲見桃華眼裏添得沙玄沙道未徹針頭擬削鐵借路還家處處通桃華何地不相逢於今不見靈雲老孤負桃華滿塢紅佛誕上堂初生滿口露冰霜天上人間不覆藏可惜雲門棒頭短至今處處起餘殃雖則利益衆生未免互相鈍置只如正令施行又作麼生拈拄杖曰無文印子間拋出千古熏風殿閣涼上堂本無一毫許盡力提不起只饒諸佛來莫能動著伊然雖如是卻在山僧手裏放之則彌於六合卷之則退藏於密且道不舒不卷又作麼生以兩手作拓空勢曰也只在裏許馬太保同衆裝塑四大天王開光請上堂大道無形越古今正眼圓明絶點塵莊嚴萬德河沙象原是河沙萬德身證得此身方現天王人王宰官居士等身而為説法化度衆生同明般若雖然風調雨順四王職國泰民安天下豐臘八上堂瞿曇在淨梵王宮一日遊觀四門見有生老病死忽自知覺憂愁恐怖子夜逾城特入雪山苦行六年形同枯木面若死灰忽睹明星喜展眉宇歎曰一切衆生俱有如來智慧德相只因妄想執著不能證得祇如今日釋迦老子不執著所證何事而有此智慧德相良久曰會麼今日榮華人不識十年前是一書生誕日上堂年年臘月初十認取山僧眼橫鼻直看他者箇模樣其中有甚奇特人人本具神通河沙諸佛不別休認聖凡二途畢竟是何面目良久曰過去阿僧只劫也是者箇面目未來阿僧只劫也是者箇面目即今聻喝一喝曰智者應須合自知無邊光景都漏泄上堂僧問逢人即不出出則便為人意旨如何師打曰汝道山僧為人不為人進曰昨夜緑溪添瑞彩今朝杲日正中天師曰照破腦門乃曰善信營辦香齋禮請舉揚箇事殊不知開口也在裏許不開口也在裏許開口不開口總在裏許三世諸佛到者裏直得口挂壁上歷代祖師到者裏緘口結舌天王到者裏只得向無説中説去也卓拄杖一下曰啼得血流無用處不如緘口度殘春上堂僧問一華拈後五葉流芳第一義諦請師速道師曰落二落三進曰如何是踞地獅子師卓拄杖一下進曰如何是全身獨露師曰且放過一著進曰千峰勢到嶽邊止萬派聲歸海上消師打曰好生計取乃曰河沙世界河沙佛盡在毛孔八萬中三界蕩然誰是主無位真人赤骨律等間拈出無私語萬別千差俱掀卻復舉世尊升座文殊白捶曰諦觀法王法法王法如是世尊便下座師曰文殊以己方人世尊隨風倒柁天王今日上堂也是無可無不可佛誕上堂分明一箇間家具指天指地令人疑到頭依舊成無用徒將惡水澆面皮雖然也要借他鼻孔通箇消息良久曰劍去久矣勿勞刻舟上堂盡大地是箇法身遍虛空是箇自己無彼無此歷歷明明若能直下知歸便是那伽大定山僧不敢委曲諸人只如緘眼裏魚吞卻嘉州大象又作麼生良久曰莫守寒嵒易草青坐卻白雲終不妙開爐上堂烈焰騰騰徹太空箇中消息許誰通𡎺著磕著全體現縱橫無礙處處逢逢不逢山僧將汝者些鈍鐵頑銅鎔作一爐火星飛處難棲泊無位真人滿面紅喝一喝誕日上堂僥幸世間若浮雲須知何事可長存分明有箇無生話切忌隨他成巧名豎拂子曰會麼自從迦葉分燈後須信人人稱獨尊上堂世間之法必假莊嚴施設而成其美出世間之法不假莊嚴施設而能成就諸莊嚴者所以古人道一念不生全體現六根才動被雲遮斷除妄想重增病趨向真如亦是邪天王亦有箇方便處若向六根動用處見得便能成就諸莊嚴者若向一念不生處見得便能成就不假莊嚴者雖然如是猶是者邊消息如何是那邊消息拈拄杖卓一卓曰覿面現成休擬議普天匝地一身歸浴佛上堂指天指地獨稱尊攪得三千海嶽昏面目從來含萬象鼻孔依然搭上唇但得年年齊出手香湯澆沐佛身塵薦焦守府請上堂以拂子畫一畫曰乾三連坤六斷取坎填離撤地補天此是吾焦公三十年用心處於今行滿功圓飄然而往四大各還寶所五陰仍返故鄉且道真人在甚麼處復畫一畫曰識得此中真妙訣不須歸去問天尊誕日上堂沙界共一體乾坤無內外覓之不可得無在無不在諸人與我慶長庚我與諸人實不壞不以色身見不以音聲求拈華顯真智微笑賣風流此事明明合自知一輪高出五雲外上堂僧問第一義諦即不問如何是法本無法師一喝如何是隨機即應師一喝清淨法身以何名戒師一喝圓滿報身以何名定師一喝三類化身以何名慧師一喝僧曰山自青青水自緑誰家灶裏火無煙師一喝乃曰若有百千萬億人來各持一問山僧總與一喝何也清淨妙體古今傳應現塵沙示本然出沒無非空合空動轉何曾有變遷伶俐漢仔細看莫教錯過上頭關上堂良久豎拂子曰見麼若向者裏見得垂手人間縱橫自在向十字街頭覓箇知音任意逍遙君臣道合父子一源十方世界捏聚捏散如觀掌果亦如牟尼寶珠森羅萬象於中出現諸佛承此攝化衆生同成正覺淳白承此詩書教子忠孝持家落落生平悠悠歲月山僧不覺喜而為之歌曰秋月高縣秋水碧天秋香拂拂畫堂前秋風涼兮透心髓班衣舞兮鬧庭喧從來子孝父心歡不是神仙也是神仙上堂喝一喝曰即此一喝如天普蓋似地普擎森羅育在其中聖凡交互渾融明歷歷有玄有要活潑潑有主有賓人人各具娘生面鼻孔從來向下垂汝等因甚不知儻到那時黑面老子斷不相饒功名也富貴也恩愛也勢力也到此總用不著何不向未舉之先通身放下得箇安樂之處會麼苟或不然再示一偈抖摟精神沒半些綿綿密密有誰遮猛然窺破非他物消卻從前眼內沙復喝一喝上堂僧問如何是清淨法身師曰王粲樓如何是圓滿報身師曰觀音塔如何是三類化身師曰磕頭磕額僧禮拜師打曰不值半文錢乃曰時時無生國刻刻劫外天拈起拄杖子左右任逢緣相見聚首時不在語默間既不在語默間又在甚處相見卓拄杖曰會麼臘八上堂僧問昨夜抬頭望北斗明星出現眼睛枯意旨如何師曰休來詐明頭進曰踏翻銀浪千尋雪天外縱橫得自繇師曰非汝境界乃曰灰頭土面似著呆忽睹明星眼便開大千沙界能為主一微塵裏一如來拈拄杖曰且道那箇是微塵那箇是如來喝一喝曰一任顛倒上堂僧問供養三世諸佛不如供養一箇無心道人如何是無心道人師曰早晨喫薄粥於今猶覺飢進曰如此則穿衣喫飯不知名師打曰拄杖子吞卻汝也乃曰請升此座舉揚法化殊不知盡是諸人頭頭磕著何須外求説甚點鐵成金不二法門不見道幻化空身即法身法身覺了無一物良久曰黃金自有黃金價終不和沙賣與人誕日上堂十方龍象喜聚集盡為山僧慶壽期擊鼓敲鐘請升座全身突露發天機大道不隨乾坤轉太虛日月莫能移徐徐香風梅先放報道群芳莫待遲卓拄杖曰委悉麼師在天王首座寮秉拂上堂僧問法源一派傳來久法翁端能繼其後一人覓得格外機叢林紹續作獅吼獅聲吼處即不問除卻返躑請師宣師曰爪牙已露僧一喝師曰亂喝問臥雪冰梅新綻玉一枝先放冷含輝群芳占斷君為首時節到來唱祖機且道祖機作麼生酬唱師曰池開霄漢分黃道龍向天門入紫微進曰錦上鋪華添瑞彩禪燈從此續聯芳師曰普天匝地喜春歸乃曰佛祖衆生塗污此名撿點將來誰之過歟喝一喝曰委悉麼無纖毫過患有莫大威光世尊不説説迦葉不聞聞天上有星皆拱北人間無水不朝東只要諸兄覿面承當管教推門落臼只如知恩報恩又作麼生脫體道時無一字滿堂雲水盡知音當陽度門禪寺語録上堂孤峰萬仞鳥道虛玄是非頓絶名利杳忘大通塔畔只見雲騰煙靄楞伽峰上但聞虎嘯猿啼歷歷真機明明分付何須百城煙水始睹慈氏八十行腳方悟真乘人人目見耳聞不須骷髏穿卻即今皇風蕩蕩聖德輝輝還有知恩報恩者麼良久曰坐倚長松忘百慮心香一瓣滿山樓上堂秀公北宗地干載絶是非山僧今到來雪曲和難齊聊作住山翁輸我都不會報與諸方參學人輕輕莫踏度門路上堂箇事明明耀古騰今視之不見聽之不聞只在尋常動用處今朝舉起一番新豎拂子喝一喝曰急急如律令
